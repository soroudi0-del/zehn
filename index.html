<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تمرین ذهن مامانجون</title>
<style>
:root{--bg:#fdf6ea;--card:#fff;--ink:#2a2a35;--pri:#2a7f6f;--pri2:#48a690;--acc:#f0a53a;--bad:#c4503f;--soft:#e6f2ee;--ln:#eadfca;--sh:0 6px 16px rgba(70,45,10,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{margin:0;font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;color:var(--ink);font-size:22px;line-height:1.65;min-height:100vh;background:radial-gradient(circle at 100% 0,#ffe6bd,transparent 45%),radial-gradient(circle at 0 100%,#d3eee3,transparent 45%),var(--bg);background-attachment:fixed}
#app{max-width:560px;margin:0 auto;padding:16px 16px 44px}
h1{font-size:30px;margin:6px 0 10px;text-align:center}h2{font-size:26px;text-align:center;margin:8px 0}
p.s{text-align:center;color:#665;margin:4px 0 12px}
button{font:inherit;cursor:pointer;border:0;border-radius:20px;padding:15px 18px;background:linear-gradient(180deg,var(--pri2),var(--pri));color:#fff;font-size:23px;width:100%;margin:7px 0;box-shadow:0 4px 0 #1f5f53,var(--sh);transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #1f5f53}
button.alt{background:#fff;color:var(--ink);border:2px solid var(--ln);box-shadow:0 3px 0 var(--ln)}
button.row{display:flex;align-items:center;gap:14px;text-align:right;background:var(--card);color:var(--ink);border:2px solid var(--ln);box-shadow:0 3px 0 var(--ln),var(--sh);position:relative;padding:12px 14px}
button.row small{display:block;font-size:17px;color:#776;line-height:1.4}
button.row.dn{border-color:var(--pri2);background:#f1faf6}
.ic{width:54px;height:54px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.tick{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border-radius:22px;padding:15px;margin:12px 0;border:2px solid var(--ln);box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,#2a7f6f,#58b39d);color:#fff;border:0;text-align:center;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12);left:-40px;top:-50px}
.pop{animation:pop .5s}@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.big{font-size:58px;text-align:center;direction:ltr;margin:12px 0;font-weight:bold}
.ans{font-size:48px;text-align:center;direction:ltr;min-height:72px;background:var(--soft);border-radius:18px;margin:6px 0;border:2px dashed var(--pri2)}
.pad{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.pad button{margin:0;font-size:32px;padding:13px;background:#fff;color:var(--ink);border:2px solid var(--ln);box-shadow:0 3px 0 var(--ln)}
.pad .ok{background:var(--pri);color:#fff;border:0;box-shadow:0 3px 0 #1f5f53}.pad .del{background:var(--acc);color:#fff;font-size:22px;border:0;box-shadow:0 3px 0 #b97b1c}
.bar{display:flex;justify-content:space-between;color:#665;font-size:20px}
.prog{height:12px;background:var(--ln);border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--acc));border-radius:8px}
.board{position:relative;width:100%;aspect-ratio:1;background:var(--soft);border-radius:26px;margin:10px 0;border:2px solid var(--ln)}
.blk{position:absolute;width:20%;height:20%;transform:translate(-50%,-50%);border-radius:18px;background:#b9cdc7;padding:0;margin:0;box-shadow:none}
.blk.on{background:var(--acc);transform:translate(-50%,-50%) scale(1.1);box-shadow:0 0 0 6px rgba(240,165,58,.35)}
.stim{height:260px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:26px;border:2px solid var(--ln);box-shadow:var(--sh)}
.dot{width:160px;height:160px;border-radius:50%;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.fb{text-align:center;min-height:40px;font-size:26px}.good{color:var(--pri)}.bad{color:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opts button{margin:0}
.r{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #ddd;gap:8px}
.note{font-size:17px;color:#776;text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.cd{aspect-ratio:1;font-size:46px;padding:0;margin:0;background:linear-gradient(135deg,#b9d9d0,#8fc3b6);color:#fff}.cd.up{background:#fff;border:3px solid var(--acc)}.cd.ok{background:#cdebd8;box-shadow:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal div{border-radius:12px;padding:3px 0;min-height:60px;font-size:16px;background:#fff;border:1px solid var(--ln)}
.cal small{display:block;font-size:13px;line-height:1.2}
.cal .h{background:none;border:0;min-height:0;color:#776;font-weight:bold}.cal .e{background:none;border:0}
.cal .y{background:#d6efe0;border-color:var(--pri2)}.cal .n{background:#fbe3dd;border-color:#e6a99d}.cal .t{outline:3px solid var(--acc)}
.cal b{display:block;font-size:21px}
.nav{display:flex;gap:8px;align-items:center}.nav button{width:70px;margin:0}.nav h2{flex:1;margin:0}
input{font:inherit;font-size:24px;width:100%;padding:12px;border-radius:14px;border:2px solid var(--ln);text-align:center;-webkit-user-select:text;user-select:text}
button:focus-visible,input:focus-visible{outline:4px solid var(--acc);outline-offset:2px}@media(prefers-reduced-motion:reduce){.pop{animation:none}*{transition:none!important}}
.cf{position:fixed;top:-50px;font-size:30px;animation:fall 4s linear forwards;pointer-events:none;z-index:5}@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}@media(prefers-reduced-motion:reduce){.cf{display:none}}
</style></head><body><div id="app"></div>
<script>
const A=document.getElementById('app');
const fa=s=>String(s).replace(/(\d)\.(\d)/g,'$1٫$2').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[rnd(0,a.length-1)];
const avgOf=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const p2=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
let onMenu=true,run=0,keyH=null,gameStart=Date.now();const begun=()=>{onMenu=false;try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}gameStart=Date.now();return ++run};
document.addEventListener('keydown',e=>{if(keyH)keyH(e)});
/* ذخیره‌سازی */
let S={};try{S=JSON.parse(localStorage.getItem('zehn_set'))||{}}catch(e){}
S.name=cleanName(S.name||'');const who=()=>/جون|جان/.test(S.name)?S.name:S.name+' جان';if(!S.first)S.first=dk(new Date());
function cleanName(v){return v.replace(/[<>&"'`$\\]/g,'').trim()||'مامانجون'}
function saveS(){try{localStorage.setItem('zehn_set',JSON.stringify(S))}catch(e){}document.body.style.fontSize=(S.big?27:22)+'px'}saveS();
let MEM=[];function load(){for(const k of['zehn_hist','zehn_hist2']){try{const a=JSON.parse(localStorage.getItem(k)||'null');if(Array.isArray(a)&&(a.length||!MEM.length))return a}catch(e){}}return MEM}
function save(o){o.date=new Date().toISOString();o.day=dk(new Date());o.dur=Date.now()-gameStart;try{const arr=load().concat([o]);MEM=arr;const j=JSON.stringify(arr);localStorage.setItem('zehn_hist',j);localStorage.setItem('zehn_hist2',j)}catch(e){}}
const fmt=ms=>{const s=Math.round(ms/1000),m=Math.floor(s/60);return m?fa(m)+' دقیقه و '+fa(s%60)+' ثانیه':fa(s)+' ثانیه'};
const NAMES={math:'ریاضی',corsi:'حافظه‌ی مکان‌ها',gng:'سبز برو، قرمز نه',stroop:'رنگ کلمه',speed:'ردیاب سریع',pairs:'جفت‌یابی'};
const CL={math:'#ffe3b8',corsi:'#cfe6ff',gng:'#cdf0d9',stroop:'#ffd3e0',speed:'#fff0a8',pairs:'#e2d6ff'};
const PR=['آفرین','باریکلا','احسنت','دمت گرم','چه عالی','ماشاالله','دست‌مریزاد','بارک‌الله','عالی بود','چه خوب','خسته نباشی','چه ذهن قوی‌ای'];
/* تقویم شمسی */
function g2j(gy,gm,gd){const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy>1600?979:0;gy-=gy>1600?1600:621;const g2=gm>2?gy+1:gy;
let days=365*gy+Math.floor((g2+3)/4)-Math.floor((g2+99)/100)+Math.floor((g2+399)/400)-80+gd+gdm[gm-1];
jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;
if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}
return{year:jy,month:days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30),day:1+(days<186?days%31:(days-186)%30)}}
const pd=d=>g2j(d.getFullYear(),d.getMonth()+1,d.getDate());
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const noon=d=>{const x=new Date(d);x.setHours(12,0,0,0);return x};
const mStart=d=>{d=noon(d);while(pd(d).day>1)d.setDate(d.getDate()-1);return d};
let calS=mStart(new Date());
const GR=3;/* بین دو روز تمرین تا ۲ روز فراموشی بخشیده می‌شود */
const dn=k=>{const[a,b,c]=k.split('-').map(Number);return Math.round(Date.UTC(a,b-1,c)/864e5)};
function chains(days){const C=[];Object.keys(days).sort().map(dn).forEach(d=>{const l=C[C.length-1];if(l&&d-l.e<=GR)l.e=d;else C.push({s:d,e:d})});return C}
const gapNow=days=>{const C=chains(days),l=C[C.length-1];return l?dn(dk(new Date()))-l.e:99};
function streak(days){const C=chains(days),l=C[C.length-1];return l&&gapNow(days)<=GR?l.e-l.s+1:0}
function streakMsg(days){const n=streak(days),g=gapNow(days);if(!n)return'';return g>=2?'🔥 '+fa(n)+' روز در مسیر تمرین<br>💛 چند روز نبودی، اشکالی ندارد! امروز یک تمرین کن تا مسیرت ادامه پیدا کند.':'🔥 '+fa(n)+' روز پشت‌سرهم'}
function byDay(){const o={};load().forEach(h=>{(o[h.day]=o[h.day]||[]).push(h.game)});return o}

function menu(){run++;keyH=null;onMenu=true;const days=byDay(),td=days[dk(new Date())]||[],done=new Set(td),h=new Date().getHours();
const g=h>=5&&h<12?'صبح بخیر':h>=12&&h<16?'ظهر بخیر':h>=16&&h<20?'عصر بخیر':'شب بخیر';
A.innerHTML=`<h1>🧠 تمرین ذهن ${S.name}</h1>
<div class="card hero"><div style="font-size:26px">${g} ${who()} 🌸</div>
<div>${td.length?`✔ امروز ${fa(td.length)} تمرین انجام شد`:'امروز هنوز تمرین نکرده‌ای. یک بازی کوچک؟'}</div>
<div class="note" style="color:#e8f6f1">${streakMsg(days)} ${medalsN()}</div><div style="margin-top:8px;font-size:20px">💬 ${hope()}</div></div>
${[['math','➕','ریاضی','چهار عمل اصلی با زمان‌سنج','mathSetup'],['corsi','🟦','حافظه‌ی مکان‌ها','ترتیب مربع‌های روشن را تکرار کنید','corsi'],['gng','🟢','سبز برو، قرمز نه','سرعت و خودداری','gng'],['stroop','🎨','رنگ کلمه','رنگ نوشته را بگویید، نه خود کلمه','stroop'],['speed','⭐','ردیاب سریع','ستاره کجا بود؟','speed'],['pairs','🃏','جفت‌یابی','کارت‌های همانند را پیدا کنید','pairs']]
.map(x=>`<button class="row ${done.has(x[0])?'dn':''}" onclick="intro('${x[0]}','${x[2]}','${x[4]}')"><span class="ic" style="background:${CL[x[0]]}">${x[1]}</span><span><b>${x[2]}</b><small>${x[3]}</small></span>${done.has(x[0])?'<span class="tick">✔</span>':''}</button>`).join('')}
<button class="alt" onclick="calS=mStart(new Date());calendar()">📅 تقویم تمرین‌ها</button>
<button class="alt" onclick="hist()">📈 پیشرفت من</button>
<button class="alt" onclick="settings()">⚙️ تنظیمات</button>
`}

const HELP={
math:'سؤال‌های جمع، تفریق، ضرب و تقسیم؛ در سه نوع: «هوشمند» (خودش سختی را با توانایی شما تنظیم می‌کند)، «سریع و ساده» و «چالشی». جواب را با دکمه‌ها بنویسید و «تأیید» بزنید. زمان کل ثبت می‌شود. عجله نکنید؛ درست‌بودن مهم‌تر است.',
corsi:'مربع‌ها یکی‌یکی روشن می‌شوند. بعد همان ترتیب را لمس کنید. برای هر طول دو فرصت دارید. اگر هر دو اشتباه شد، بازی تمام می‌شود.',
gng:'اول ۴ بار تمرین (حساب نمی‌شود). بعد ۳۰ دایره می‌آید. سبز را فوراً لمس کنید. قرمز را لمس نکنید.',
stroop:'یک کلمه‌ی رنگی می‌آید، مثلاً «قرمز» که با رنگ آبی نوشته شده. باید رنگ نوشته (آبی) را انتخاب کنید، نه معنی کلمه را. ۴ بار تمرین دارید که حساب نمی‌شود.',
speed:'به علامت ＋ وسط نگاه کنید. ستاره لحظه‌ای در یکی از ۸ جای دور می‌آید. بعد جایش را لمس کنید. هر چه خوب‌تر باشید، سریع‌تر می‌شود.',
pairs:'کارت‌ها برعکس‌اند. هر بار دو کارت را باز کنید. اگر همانند بودند می‌مانند. همه‌ی جفت‌ها را پیدا کنید، با کمترین حرکت. تعداد کارت‌ها خودش با توانایی شما تنظیم می‌شود.'};
function intro(g,t,fn){run++;keyH=null;onMenu=false;A.innerHTML=`<h2>${t}</h2><div class="card">${HELP[g]}<div class="note" style="margin-top:8px">🧭 سختی بازی به‌مرور با توانایی شما تنظیم می‌شود.</div></div><button onclick="${fn}()">شروع کنیم، ${who()}</button><button class="alt" onclick="menu()">بازگشت</button>`}

const HOPE=['هر روز که تمرین می‌کنی، یک قدم جلو می‌روی. قدم کوچک هم قدم است.','یادگیری هیچ‌وقت دیر نیست. مغز در هر سنی می‌تواند چیزهای تازه یاد بگیرد.','تجربه‌ی یک عمر پشتت است و حالا داری چیزهای تازه هم اضافه می‌کنی.','اشتباه یعنی داری یاد می‌گیری. فقط امتحان کردنش هم ارزش دارد.','آمدنِ هر روزت از هر نتیجه‌ای مهم‌تر است.','امروز هم یک روز خوب برای شروع است.','پشتکارت قابل تحسین است. همین‌طور آرام و پیوسته ادامه بده.','هر بار که حواست را جمع می‌کنی، داری ذهنت را ورزش می‌دهی.','روزهای کندتر هم می‌آید و می‌رود. مهم این است که ادامه می‌دهی.','خودت را با دیروزِ خودت مقایسه کن، نه با کسی دیگر. تو داری بهتر می‌شوی.','کسانی که دوستت دارند از دیدن پشتکارت خوشحال می‌شوند.','دست‌مریزاد! ذهنِ فعال، زندگیِ پرنشاط.','هر روز که می‌آیی، ذهنت فعال‌تر و پرانرژی‌تر می‌شود.','تو می‌توانی؛ همین حالا هم نشان دادی که می‌توانی!','خانواده‌ات به پشتکار تو افتخار می‌کنند.','سن فقط یک عدد است؛ ذهن تو زنده و پویاست.','امروز از دیروز بهتر شدی، فردا از امروز هم بهتر می‌شوی.','آدم‌های صبور به هر جا که بخواهند می‌رسند؛ تو صبوری.','ذهن تو مثل یک باغ است؛ هر تمرین یک بذر تازه می‌کارد.'];
const hope=()=>HOPE[Math.floor(Date.now()/864e5)%HOPE.length];
const GN={'math:a':'ریاضی هوشمند','math:s':'ریاضی سریع و ساده','math:h':'ریاضی چالشی',corsi:'حافظه‌ی مکان‌ها',gng:'سبز برو، قرمز نه',stroop:'رنگ کلمه',speed:'ردیاب سریع',pairs:'جفت‌یابی'};
const GI={'math:a':'🧠','math:s':'⚡','math:h':'🧩',corsi:'🟦',gng:'🟢',stroop:'🎨',speed:'⭐',pairs:'🃏'};
const msf=v=>fa(Math.round(v))+' میلی‌ثانیه';
const METg={'math:a':{low:0,v:x=>x.lv,f:v=>'مرحله '+fa(+v.toFixed(1))},'math:s':{low:1,v:x=>x.time/x.n/1000,f:v=>fa(v.toFixed(1))+' ثانیه/سؤال'},'math:h':{low:1,v:x=>x.time/x.n/1000,f:v=>fa(v.toFixed(1))+' ثانیه/سؤال'},
corsi:{low:0,v:x=>x.score,f:v=>fa(+v.toFixed(1))+' مربع'},gng:{low:1,v:x=>x.rt,f:msf},stroop:{low:1,v:x=>x.rt,f:msf},speed:{low:1,v:x=>x.minMs,f:msf},pairs:{low:1,v:x=>x.moves/(x.np||6),f:v=>fa(v.toFixed(1))+' حرکت/جفت'}};
const gk=x=>x.game==='math'?'math:'+(x.mode||'h'):x.game;
const MV=x=>{const m=METg[gk(x)],v=m?m.v(x):0;return isFinite(v)&&v>0?v:0};
const ACC=x=>x.game==='gng'?1-(x.miss+x.falseAlarm)/30:x.game==='pairs'?null:x.n?x.correct/x.n:null;
function trend(v,low){const n=v.length;if(n<2)return null;const k=Math.min(3,Math.floor(n/2)),a=avgOf(v.slice(0,k)),b=avgOf(v.slice(-k));return{ch:(low?a-b:b-a)/a*100}}
function maxStreak(days){return Math.max(0,...chains(days).map(c=>c.e-c.s+1))}
const MCAT=['🏁 تعداد تمرین‌ها','📅 روزهای تمرین','🔥 همراهی و پشتکار (بدون ترس از چند روز فراموشی)','🎮 استادی در هر بازی','🎯 عملکرد و ویژه'];
function medals(){const h=load(),days=byDay(),nd=Object.keys(days).length,ms=maxStreak(days),M=[],add=(ok,i,t,c)=>M.push({ok,i,t,c});

open=[];lock=false;document.getElementById('m').textContent='حرکت: '+fa(moves);document.getElementById('p').textContent=fa(found)+' از '+fa(NP)+' جفت';
if(found===NP){const t=performance.now()-t0;if(moves<=NP*2)S.pl=LV[Math.min(3,LV.indexOf(NP)+1)];else if(moves>NP*3.5)S.pl=LV[Math.max(0,LV.indexOf(NP)-1)];saveS();result('pairs',[['تعداد جفت‌ها',fa(NP)],['تعداد حرکت',fa(moves)+' (کمترین ممکن '+fa(NP)+')'],['زمان',fmt(t)],['دفعه‌ی بعد',S.pl>NP?'کارت‌های بیشتر 💪':S.pl<NP?'کمی سبک‌تر':'همین اندازه']],{moves,np:NP,time:Math.round(t)})}}}

function backup(){const b=new Blob([JSON.stringify({set:S,hist:load()})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mamanjoon-backup-'+dk(new Date())+'.json';document.body.appendChild(a);a.click();a.remove()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.hist))throw 0;if(o.set&&typeof o.set==='object'){if(o.set.first&&o.set.first<S.first)S.first=o.set.first;if(o.set.name)S.name=cleanName(String(o.set.name));saveS()}const cur=load(),ks=new Set(cur.map(x=>x.date)),m=cur.concat((o.hist||[]).filter(x=>x&&x.date&&x.game&&!ks.has(x.date))).sort((a,b)=>a.date<b.date?-1:1),j=JSON.stringify(m);MEM=m;localStorage.setItem('zehn_hist',j);localStorage.setItem('zehn_hist2',j);alert('بازیابی شد ✔');menu()}catch(e){alert('این فایل پشتیبان درست نیست.')}};r.readAsText(f)}
function spark(vs,low){if(vs.length<2)return'';const v=vs.slice(-20),mn=Math.min(...v),rg=Math.max(...v)-mn||1,pts=v.map((x,i)=>{let y=(x-mn)/rg;if(low)y=1-y;return[8+i*(184/(v.length-1)),42-y*34]});
return`<svg viewBox="0 0 200 50" style="width:100%;height:64px;direction:ltr"><polyline fill="none" stroke="#2a7f6f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?'#f0a53a':'#2a7f6f'}"/>`).join('')}</svg>`}
function hist(all){run++;keyH=null;onMenu=false;const h=load(),days=byDay(),nd=Object.keys(days).length;
if(!h.length){A.innerHTML=`<h2>پیشرفت ${S.name}</h2><div class="card hero">🌱 هنوز تمرینی ثبت نشده. با اولین بازی، مسیر پیشرفتت شروع می‌شود ${who()}!</div><button onclick="menu()">بازگشت</button>`;return}
const tot=h.reduce((a,x)=>a+(x.dur||0),0),grp={};h.forEach(x=>{(grp[gk(x)]=grp[gk(x)]||[]).push(x)});
const ed=k=>{const[y,m,d]=k.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)},wk=e=>Math.floor((e-2)/7),cw=wk(ed(dk(new Date()))),wc=Array(8).fill(0);
h.forEach(x=>{const i=cw-wk(ed(x.day));if(i>=0&&i<8)wc[i]++});const mx=Math.max(...wc,1);
const bars=wc.map((c,i)=>`<div style="flex:1;text-align:center;font-size:15px"><div>${c?fa(c):''}</div><div style="height:${c/mx*70+3}px;background:${i?'#8fc3b6':'#f0a53a'};border-radius:6px"></div><div style="color:#776;font-size:13px">${i?'':'الان'}</div></div>`).reverse().join('');
const chs=[],order=['math:a','math:s','math:h','corsi','gng','stroop','speed','pairs'];
const cards=order.filter(g=>grp[g]).map(g=>{const rs=grp[g],mt=METg[g],vs=rs.map(MV).filter(v=>v>0),as=rs.map(ACC).filter(a=>a!=null&&isFinite(a)),t=trend(vs,mt.low),n=rs.length,best=vs.length?(mt.low?Math.min(...vs):Math.max(...vs)):0,last=vs.length?vs[vs.length-1]:0;
let tr;if(n<3||!t)tr='🌱 هنوز تازه شروع کرده‌ای. بعد از چند بار تمرین، روند دقیق را نشان می‌دهم.';else{chs.push(t.ch);tr=t.ch>5?`📈 نسبت به روزهای اول ${fa(Math.round(t.ch))}٪ بهتر شده. آفرین!`:t.ch<-5?'🌤 کمی پایین‌تر از روزهای اول؛ نوسان طبیعی است و دوباره بالا می‌آید.':'➖ ثابت و پایدار؛ همین ثبات هم ارزشمند است.'}
return`<div class="card"><b>${GI[g]} ${GN[g]}</b> <span class="note">(${fa(n)} بار)</span><div class="r"><span>آخرین</span><b>${last?mt.f(last):'—'}</b></div><div class="r"><span>بهترین</span><b>${best?mt.f(best):'—'}</b></div><div class="r"><span>میانگین</span><b>${vs.length?mt.f(avgOf(vs)):'—'}</b></div>${as.length?`<div class="r"><span>دقت (درست‌بودن) میانگین</span><b>${fa(Math.round(avgOf(as)*100))}٪${as.length>1?' · آخرین '+fa(Math.round(as[as.length-1]*100))+'٪':''}</b></div>`:''}<div style="margin-top:6px">${tr}</div>${spark(vs,mt.low)}${vs.length>1?'<div class="note">نمودار: بالاتر = بهتر</div>':''}</div>`}).join('');
const O={};h.filter(x=>x.ops).forEach(x=>Object.entries(x.ops).forEach(([o,v])=>{const z=O[o]=O[o]||[0,0,0];z[0]+=v[0];z[1]+=v[1];z[2]+=v[2]||0}));
const on={'+':'جمع','−':'تفریق','×':'ضرب','÷':'تقسیم'},opRows=['+','−','×','÷'].filter(o=>O[o]&&O[o][0]+O[o][1]>0).map(o=>{const z=O[o],n=z[0]+z[1];return`<div class="r"><span>${on[o]} ${o}</span><b>${fa(Math.round(z[0]/n*100))}٪ درست · ${fa((z[2]/n/1000).toFixed(1))} ثانیه</b></div>`}).join('');
const ca=chs.length?avgOf(chs):null,sum=ca==null?'🌱 چند بار دیگر تمرین کنی، روند پیشرفتت را دقیق نشان می‌دهم.':ca>5?`📈 به‌طور کلی نسبت به شروع حدود ${fa(Math.round(ca))}٪ بهتر شده‌ای. دمت گرم ${who()}!`:ca<-5?'🌤 این روزها کمی آرام‌تر بوده‌ای؛ مهم نیست. آمدنت از هر عددی مهم‌تر است.':'➖ عملکردت پایدار مانده؛ ثبات هم نشانه‌ی خوبی است.';
const md=medals(),rec=[...h].reverse(),show=all?rec:rec.slice(0,12);
const list=show.map(x=>{const m=METg[gk(x)],v=MV(x),a=ACC(x);return`<div class="r"><span>${new Date(x.date).toLocaleDateString('fa-IR')} · ${GI[gk(x)]} ${GN[gk(x)]}</span><b>${v?m.f(v):''}${a!=null&&isFinite(a)?' · '+fa(Math.round(a*100))+'٪':''}</b></div>`}).join('');
A.innerHTML=`<h2>پیشرفت ${S.name}</h2><div class="card hero">${sum}<div class="note" style="color:#e8f6f1;margin-top:4px">همه‌ی مقایسه‌ها فقط با خودِ شماست، نه با دیگران.<br>💛 اگر یکی دو روز تمرین را فراموش کنید، مسیرتان از نو شروع نمی‌شود.</div></div>
<div class="card"><b>📊 خلاصه</b><div class="r"><span>تعداد تمرین‌ها</span><b>${fa(h.length)}</b></div><div class="r"><span>روزهای تمرین</span><b>${fa(nd)}</b></div><div class="r"><span>پشت‌سرهم (الان / بیشترین)</span><b>${fa(streak(days))} / ${fa(maxStreak(days))} روز</b></div>${tot?`<div class="r"><span>مجموع زمان تمرین</span><b>${fmt(tot)}</b></div>`:''}<div class="r"><span>میانگین تمرین در روزِ فعال</span><b>${fa((h.length/nd).toFixed(1))}</b></div></div>

<div class="card"><b>🏅 مدال‌ها و جام‌ها</b> <span class="note">(${fa(md.filter(m=>m.ok).length)} از ${fa(md.length)})</span>${MCAT.map((c,ci)=>`<div style="margin-top:12px;font-weight:bold;color:var(--pri)">${c}</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">${md.filter(m=>m.c===ci).map(m=>`<div style="text-align:center;width:30%;opacity:${m.ok?1:.28};font-size:15px"><div style="font-size:34px">${m.i}</div>${m.t}</div>`).join('')}</div>`).join('')}</div>
${cards}${opRows?`<div class="card"><b>➕ ریاضی به تفکیک عمل (همه‌ی دوره‌ها)</b>${opRows}</div>`:''}
<div class="card"><b>🧾 سابقه‌ی تمرین‌ها</b> <span class="note">(${fa(h.length)} مورد، همه نگه داشته می‌شود)</span>${list}</div>
${all?'':h.length>12?'<button class="alt" onclick="hist(true)">نمایش همه‌ی سابقه</button>':''}<button class="alt" onclick="backup()">💾 ذخیره‌ی نسخه‌ی پشتیبان</button><button onclick="menu()">بازگشت</button>`}
